name: Check Trigger

on:
  workflow_dispatch:
    inputs:
      csv:
        description: 'Base64 string CSV file of forecast'
        default: ""
      flags:
        description: 'Flags passed to Python script'
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: monitoring-requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r monitoring-requirements.txt
      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: inputs
          path: inputs/
          if_no_artifact_found: warn
      - name: Run Check Trigger Script
        run: python src/update_trigger.py ${{ github.event.inputs.flags }} ${{ github.event.inputs.csv }}
        env:
          DSCI_AWS_EMAIL_ADDRESS: ${{ secrets.DSCI_AWS_EMAIL_ADDRESS }}
          DSCI_AWS_EMAIL_USERNAME: ${{ secrets.DSCI_AWS_EMAIL_USERNAME }}
          DSCI_AWS_EMAIL_PASSWORD: ${{ secrets.DSCI_AWS_EMAIL_PASSWORD }}
          DSCI_AWS_EMAIL_HOST: ${{ secrets.DSCI_AWS_EMAIL_HOST }}
          INFO_ALWAYS_TO: ${{ vars.INFO_ALWAYS_TO }}
          DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
          DSCI_AZ_BLOB_PROD_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_PROD_SAS_WRITE }}
          TEST_LIST: ${{ vars.TEST_LIST }}
      - uses: actions/upload-artifact@v4
        with:
          name: inputs
          path: inputs/
      - uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: outputs/
