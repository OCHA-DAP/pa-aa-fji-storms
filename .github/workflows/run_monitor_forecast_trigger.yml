name: Check Trigger
# Dispatches from poll_fms_inbox.py are titled "FMS <csv short hash> <event>";
# the poller lists recent runs by this title so a dispatch is never sent twice.
run-name: ${{ github.event_name == 'repository_dispatch' && format('FMS {0} {1}', github.event.client_payload.content_sha, github.event.action) || 'Check Trigger' }}

on:
  workflow_dispatch:
    inputs:
      csv:
        description: 'Base64 string CSV file of forecast'
        type: string
      test_email:
        description: 'TEST_EMAIL: If True, send email to test mailing list instead of real one (fallback: True)'
        type: choice
        options:
          - 'True'
          - 'False'
      simulate_trigger:
        description: 'SIMULATE_TRIGGER: If True, impute data to simulate triggering (fallback: False)'
        type: choice
        options:
          - 'True'
          - 'False'
      dry_run:
        description: 'DRY_RUN: If True, do not perform any write or email operations (fallback: True)'
        type: choice
        options:
          - 'True'
          - 'False'
      test_forecast_blob_name:
        description: 'Blob name of test forecast file to use instead of input CSV (optional)'
        type: string
  # Sent by the fji_trigger_monitoring Power Automate flow (GitHub connector,
  # "Create a repository dispatch event"), with client_payload.csv = base64 CSV.
  # fms_forecast_test (from a "fji_test" email) forces TEST_EMAIL=True.
  repository_dispatch:
    types: [fms_forecast, fms_forecast_test]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: initial-2025-trigger
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: monitoring-requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r monitoring-requirements.txt
      - name: Run forecast monitoring script
        env:
          DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
          DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
          DSCI_LISTMONK_API_USERNAME: ${{ vars.DSCI_LISTMONK_API_USERNAME }}
          DSCI_LISTMONK_API_KEY: ${{ secrets.DSCI_LISTMONK_API_KEY }}
          TEST_EMAIL: ${{ github.event.action == 'fms_forecast_test' && 'True' || inputs.test_email || vars.TEST_EMAIL || 'True'}}
          SIMULATE_TRIGGER: ${{ inputs.simulate_trigger || vars.SIMULATE_TRIGGER || 'False'}}
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN || 'True'}}
          TEST_FORECAST_BLOB_NAME: ${{ inputs.test_forecast_blob_name }}
        # The dispatch CSV is read from the event file so it is not echoed in the log.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            CSV_B64="$(jq -r '.client_payload.csv // ""' "$GITHUB_EVENT_PATH")"
            if [ -z "$CSV_B64" ]; then
              echo "::error::repository_dispatch arrived with an empty client_payload.csv"
              exit 1
            fi
          else
            CSV_B64="${{ inputs.csv }}"
          fi
          python pipelines/monitor_forecast_trigger.py "$CSV_B64"
