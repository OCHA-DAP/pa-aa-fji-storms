name: Check Trigger

on:
  workflow_dispatch:
    inputs:
      csv:
        description: 'Base64 string CSV file of forecast'
        default: ""
      flags:
        description: 'Flags passed to Python script'
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: monitoring-2025
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: monitoring-requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r monitoring-requirements.txt
      - name: Run forecast monitoring script
        run: python pipelines/monitor_forecast_trigger.py ${{ github.event.inputs.flags }} ${{ github.event.inputs.csv }}
        env:
          DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
          DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
          DSCI_LISTMONK_API_USERNAME: ${{ vars.DSCI_LISTMONK_API_USERNAME }}
          DSCI_LISTMONK_API_KEY: ${{ secrets.DSCI_LISTMONK_API_KEY }}
          TEST_EMAIL: ${{ vars.TEST_EMAIL || 'True'}}
          FORCE_TRIGGER: ${{ vars.FORCE_TRIGGER || 'False'}}
