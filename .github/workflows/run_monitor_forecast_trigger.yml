name: Check Trigger

on:
  workflow_dispatch:
    inputs:
      csv:
        description: 'Base64 string CSV file of forecast'
        type: string
      test_email:
        description: 'If TRUE, send email to test mailing list instead of real one (fallback: True)'
        type: boolean
      simulate_trigger:
        description: 'If TRUE, impute data to simulate triggering (fallback: False)'
        type: boolean
      dry_run:
        description: 'If TRUE, do not perform any write or email operations (fallback: True)'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: monitoring-2025
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: monitoring-requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r monitoring-requirements.txt
      - name: Run forecast monitoring script
        env:
          DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
          DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
          DSCI_LISTMONK_API_USERNAME: ${{ vars.DSCI_LISTMONK_API_USERNAME }}
          DSCI_LISTMONK_API_KEY: ${{ secrets.DSCI_LISTMONK_API_KEY }}
          TEST_EMAIL: ${{ inputs.test_email || vars.TEST_EMAIL || 'True'}}
          SIMULATE_TRIGGER: ${{ vars.SIMULATE_TRIGGER || 'False'}}
          DRY_RUN: ${{ vars.DRY_RUN || 'True'}}
        run: python pipelines/monitor_forecast_trigger.py ${{ inputs.flags }} ${{ inputs.csv }}
